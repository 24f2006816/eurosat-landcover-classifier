[project]
name = "eurosat-landcover-classifier"
version = "1.0.0"
description = "EuroSAT land-cover classification: CNN from scratch vs MobileNetV3 transfer learning"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch", "torchvision", "scikit-learn", "numpy", "matplotlib", "pillow"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["landcover"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["landcover"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
